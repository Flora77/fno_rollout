project:
  experiment_name: sea_surface_rollout_lightning
  output_root: ./outputs
  checkpoint_dirname: checkpoints
  plot_dirname: plots
  log_dirname: logs
  summary_dirname: summaries
  resolved_config_name: resolved_config.yaml
seed: 42
data:
  data_root: ./data/sea_surface_simple
  variable: height
  input_steps: 40
  output_steps: 20
  stride: 4
  rollout_stride: 4
  normalize: true
  batch_size: 8
  val_batch_size: 8
  test_batch_size: 8
  num_workers: 4
  pin_memory: true
model:
  arch: fno
  n_modes:
  - 28
  - 28
  hidden_channels: 32
  lifting_channels: 64
  projection_channels: 64
  n_layers: 4
optim:
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  scheduler:
    enabled: true
    type: plateau
    step_size: 20
    gamma: 0.5
    t_max: 80
    eta_min: 1.0e-06
    patience: 5
    factor: 0.5
    min_lr: 1.0e-06
rollout:
  use_long_rollout_curriculum: false
  rollout_train_steps:
  - 20
  - 40
  - 80
  - 120
  - 160
  - 240
  rollout_curriculum_boundaries:
  - 0.0
  - 0.1
  - 0.25
  - 0.45
  - 0.65
  - 0.8
  rollout_steps: 240
  detach_context: false
  use_segment_weighting: false
  segment_weight_type: linear
  segment_weight_min: 1.0
  segment_weight_max: 2.5
  segment_weight_power: 2.0
  normalize_segment_weights: true
  use_within_chunk_temporal_weighting: false
  chunk_time_weight_type: linear
  chunk_time_weight_min: 1.0
  chunk_time_weight_max: 2.0
  chunk_time_weight_power: 2.0
  normalize_chunk_time_weights: true
evaluation:
  dt: 0.25
  num_full_samples_to_save: 3
  num_trace_points: 5
  spectral_high_k_ratio: 0.67
  spectral_band_split_ratios:
  - 0.33
  - 0.67
  - 0.85
  plot_num_samples: 3
  plot_future_steps:
  - 19
  - 59
  - 119
  - 239
  denormalize_for_plot: true
  save_val_mat: true
  save_test_mat: true
  save_plots: true
  save_distribution_plots: true
  export_mat_name_template: '{experiment_name}_{split}_rollout.mat'
logging:
  tensorboard:
    enabled: true
    name: sea_surface_tb
  wandb:
    enabled: true
    project: sea_surface
    entity: null
    name: sea_surface_rollout_wandb
    save_dir: ./outputs/wandb
    offline: false
    tags:
    - sea_surface
    - lightning
    notes: null
  csv:
    train_summary_csv: ablation_train_summary.csv
    val_summary_csv: ablation_val_summary.csv
    test_summary_csv: ablation_test_summary.csv
trainer:
  accelerator: auto
  devices: 1
  precision: 32-true
  max_epochs: 80
  deterministic: false
  benchmark: false
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
ckpt:
  monitor: val_rollout_rmse
  mode: min
  save_top_k: 1
  save_last: true
  filename: best-epoch{epoch:03d}-valrmse{val_rollout_rmse:.6f}
  resume_from: null
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0
runtime:
  validate_after_fit: false
paths:
  root_dir: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning
  checkpoint_dir: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/checkpoints
  plot_dir: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/plots
  log_dir: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/logs
  summary_dir: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/summaries
  resolved_config_path: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/resolved_config.yaml
  val_summary_path: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/summaries/ablation_val_summary.csv
  test_summary_path: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/summaries/ablation_test_summary.csv
  train_summary_path: /home/chenping/neuraloperator/outputs/sea_surface_rollout_lightning/summaries/ablation_train_summary.csv
